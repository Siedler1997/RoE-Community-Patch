name: Copy Directories by Mapping

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "Development" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  copy-folders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Copy Directories based on mapping and Lowercase Content
        run: |
          MAP_FILE="exe/mapping.txt"

          if [ ! -f "$MAP_FILE" ]; then
            echo "Fehler: Mapping-Datei $MAP_FILE wurde nicht gefunden!"
            exit 1
          fi

          echo "Starte Kopier- und Konvertierungsprozess..."

          while IFS=' ' read -r src_dir dest_name || [ -n "$src_dir" ]; do
            
            [[ -z "$src_dir" || "$src_dir" =~ ^[[:space:]]*$ || "$src_dir" =~ ^# ]] && continue

            SRC_PATH="HE/$src_dir"
            DEST_PATH="OG/${dest_name}"

            if [ -d "$SRC_PATH" ]; then
              if [ -d "$DEST_PATH" ]; then
                echo "Kopiere $SRC_PATH nach $DEST_PATH..."
                cp -r "$SRC_PATH/." "$DEST_PATH/"

                echo "Konvertiere Inhalt von $DEST_PATH zu Lowercase..."
                # 'depth' sorgt dafür, dass Dateien in Unterordnern vor den Unterordnern selbst umbenannt werden
                find "$DEST_PATH" -depth -mindepth 1 | while read -r item; do
                  dir=$(dirname "$item")
                  base=$(basename "$item")
                  
                  # Namen in Kleinbuchstaben umwandeln
                  lowercase_base=$(echo "$base" | tr '[:upper:]' '[:lower:]')
                  
                  # Nur umbenennen, wenn der Name nicht schon komplett klein geschrieben ist
                  if [ "$base" != "$lowercase_base" ]; then
                    mv "$item" "$dir/$lowercase_base"
                  fi
                done

              else
                echo "Warnung: Zielordner $DEST_PATH existiert nicht. Überspringe."
              fi
            else
              echo "Warnung: Quellordner $SRC_PATH existiert nicht. Überspringe."
            fi

          done < "$MAP_FILE"
          
          echo "Kopierprozess beendet."

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add OG/
          
          # Nur committen, wenn tatsächliche Änderungen in OG vorliegen
          if ! git diff --staged --quiet; then
            git commit -m "Automatisches Kopieren von HE nach OG via Mapping"
            git push
          else
            echo "Keine Änderungen zum Committen vorhanden."
          fi